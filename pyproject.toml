[project]
name = "teapot-py"
version = "0.1.0"
description = "Send HTTP requests out of a chosen Teapot exit node"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manifold Systems" }]
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teapot"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: needs a running teapot agent on 127.0.0.1:1080"]
